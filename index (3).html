:root[data-theme="dark"]{--bg:#0e1a26;--surface:#162636;--ink:#e6eef5;--muted:#9fb1c1;--line:#2a3d50;--blue:#6ea0ff;--orange:#fb923c;--ok:#4ade80;--bad:#f87171;--term:#07111a}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:640px;margin:0 auto}
h1{font:800 30px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:0}
h1 span{color:var(--orange)}
header p{margin:6px 0 0;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:8px 16px}
section{display:none}
section.on{display:block}
h2{font:600 20px "Bricolage Grotesque",system-ui,sans-serif;margin:12px 0}
input,button{font:inherit}
input[type=text],input[type=search]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin:10px 0}
.item b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:17px}
.item small{color:var(--muted);margin-left:8px}
.item p{margin:4px 0 0}
.opt{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.btn{padding:12px 18px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn{color:#0e1a26}
.muted{color:var(--muted)}
.term{background:var(--term);color:var(--termink);font:14px/1.5 "IBM Plex Mono",ui-monospace,monospace;border-radius:8px;padding:12px;min-height:220px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .cmd{color:#7dd3fc}
.row{display:flex;gap:8px;margin:8px 0}
.row input{flex:1}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:16px}
.calc pre{margin:8px 0 0;font:14px/1.6 "IBM Plex Mono",ui-monospace,monospace;white-space:pre-wrap}
.xp{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--orange) 18%,var(--surface));color:var(--orange);font-weight:600;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--muted);font-weight:600}
nav button.on{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
</style>
</head>

<header>
<h1>Zil<span>net</span></h1>
<p>Kompyuter tarmoqlari va IT servisni telefonda oʻrganing.</p>
<div class="xp" id="xp"></div>
</header>
<main>
<section id="s0" class="on">
<h2>Bilimlar bazasi</h2>
<input type="search" id="q" placeholder="Qidirish: IP, DNS, router…">
<div id="kb"></div>
</section>
<section id="s1">
<h2>Test</h2>
<div id="quiz"></div>
</section>
<section id="s2">
<h2>Virtual laboratoriya</h2>
<div class="term" id="out"></div>
<div class="row"><input type="text" id="cmd" placeholder="Buyruq yozing: help" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="btn" id="run">Bajarish</button></div>

<div class="row"><input type="text" id="ip" placeholder="192.168.1.10"><input type="text" id="pf" placeholder="/24" style="max-width:90px"></div>
<button class="btn" id="calc">Hisoblash</button>
<pre id="res" class="muted">Natija shu yerda chiqadi.</pre>
</div>
</section>
<section id="s3">
<h2>Tarmoq qurish</h2>
<p id="lvt" class="muted"></p>
<svg id="net" viewBox="0 0 340 240" style="width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px"></svg>
<p class="muted">Ketma-ket ikki qurilmaga bosing: kabel ulanadi. Yana bossangiz, kabel olinadi.</p>
<div class="row"><button class="btn" id="png">Ping yuborish</button><button class="btn" id="rst">Tozalash</button><button class="btn" id="nx" hidden>Keyingi bosqich</button></div>
<p id="msg"></p>
</section>
</main>
<nav>
<button class="on" data-t="0">Bilim</button>

function msg(h,c){var m=$('msg');m.textContent=h;m.style.color=c||'var(--ink)'}
function loadLv(i){li=i;links=[];sel=null;$('nx').hidden=true;$('lvt').textContent=LV[i].t+'. '+LV[i].g;msg('');draw()}
function draw(){var s=$('net'),d=LV[li].d;s.innerHTML='';
links.forEach(function(l){var a=d[l[0]],b=d[l[1]];s.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#c2410c','stroke-width':3}))});
d.forEach(function(o,i){var g=el('g',{}),c=el('circle',{cx:o.x,cy:o.y,r:26});
c.style.fill=o.k==='rt'?'var(--orange)':o.k==='sw'?'var(--blue)':'var(--muted)';
if(sel===i){c.style.stroke='var(--ink)';c.style.strokeWidth='4'}
var t=el('text',{x:o.x,y:o.y+4,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#fff'});t.textContent=o.k==='pc'?'PC':o.k==='sw'?'SW':'R';
var n=el('text',{x:o.x,y:o.y+44,'text-anchor':'middle','font-size':11});n.style.fill='var(--ink)';n.textContent=o.n+(o.ip?' '+o.ip:'');
g.appendChild(c);g.appendChild(t);g.appendChild(n);g.style.cursor='pointer';g.onclick=function(){tap(i)};s.appendChild(g)})}
function tap(i){var d=LV[li].d;
if(sel===null){sel=i}else if(sel===i){sel=null}else{var a=d[sel],b=d[i];
if(a.k==='pc'&&b.k==='pc'){msg('Kompyuterni kompyuterga ulab boʻlmaydi. Switch ishlating.','var(--bad)');sel=null;draw();return}
var f=-1;links.forEach(function(l,j){if((l[0]===sel&&l[1]===i)||(l[0]===i&&l[1]===sel))f=j});
if(f>-1)links.splice(f,1);else links.push([sel,i]);sel=null;msg('')}
draw()}
$('png').onclick=function(){var L=LV[li],d=L.d,par={},q=[L.from];par[L.from]=-1;
while(q.length){var u=q.shift();links.forEach(function(l){var v=l[0]===u?l[1]:(l[1]===u?l[0]:-1);if(v>-1&&!(v in par)){par[v]=u;q.push(v)}})}
if(!(L.to in par)){msg('Ping oʻtmadi: qurilmalar oʻzaro ulanmagan.','var(--bad)');return}
if(L.need&&L.need.some(function(n){return !(n in par)})){msg('Ping oʻtmadi: PC1 ham tarmoqqa ulanishi kerak.','var(--bad)');return}
var path=[],x=L.to;while(x!==-1){path.push(d[x]);x=par[x]}
var sub=function(o){return o.ip.split('.').slice(0,3).join('.')};
if(sub(d[L.from])!==sub(d[L.to])&&!path.some(function(o){return o.k==='rt'})){msg('Ping oʻtmadi: tarmoqlar har xil, router kerak.','var(--bad)');return}
var last=li>=LV.length-1;
msg('Ping muvaffaqiyatli! Yoʻl: '+path.reverse().map(function(o){return o.n}).join(' > ')+(last?'. Barcha bosqichlar tugadi!':''),'var(--ok)');
if(!S.done[li]){S.done[li]=1;addXp(25)}$('nx').hidden=last};
$('nx').onclick=function(){loadLv(li+1)};
$('rst').onclick=function(){loadLv(li)};
loadLv(0);showXp();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
